<section class="datos" id="sobremi">
  <div class="mb-5">
    <h1 class="main-title">Hobbies</h1>
  </div>

  @for (hobby of hobbies; track hobby.id) {
    <div class="hobby-block mb-5">
      <h2 class="subtema">{{ hobby.title }}</h2>
      <p class="textos">{{ hobby.description }}</p>

      @if (hobby.images && hobby.images.length > 0) {
        <div class="slider-frame">
          <ul>
            @for (img of hobby.images; track img) {
              <li>
                <img [src]="img" [alt]="hobby.title">
              </li>
            }
          </ul>
        </div>
      }
    </div>
  }
</section>
